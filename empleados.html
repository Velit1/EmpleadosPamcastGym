<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pamcast Gym · Empleados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --negro:#0B0B0B; --superficie:#141414; --superficie2:#1C1C1C;
    --borde:#2A2A2A; --texto:#EDEDED; --gris:#8A8A8A;
    --acento:#9E0032; --acento-oscuro:#7A0027;
    --ok:#8BC34A; --aviso:#E5B94B; --mal:#E06C75;
    --fuente:'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --t-s:14px; --t-m:20px; --t-l:44px;
    --lateral:240px;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--negro); color:var(--texto); font-family:var(--fuente); font-size:var(--t-s); line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1, h2, h3 { font-weight:600; margin:0 0 .5em; letter-spacing:-.01em; }
  h1, h2 { font-size:var(--t-l); line-height:1.1; }
  h3 { font-size:var(--t-m); line-height:1.3; }
  p { margin:0 0 1em; color:#BDBDBD; }
  a { color:var(--acento); }
  img { max-width:100%; display:block; }
  .oculto { display:none !important; }
  .label { font-size:var(--t-s); font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--gris); margin-bottom:12px; display:block; }
  .gris { color:var(--gris); }
  .grande { font-size:var(--t-l); font-weight:600; line-height:1; }
  .derecha { text-align:right; }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

  .logo { display:flex; align-items:center; gap:10px; }
  .logo svg.marca { width:34px; height:34px; flex-shrink:0; }
  .logo span { font-weight:600; letter-spacing:.16em; font-size:var(--t-s); }

  /* Botones y formularios */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border:1px solid var(--acento); background:var(--acento); color:#fff; font:inherit; font-weight:600; font-size:var(--t-s); cursor:pointer; border-radius:0; transition:background .2s, border-color .2s; }
  .btn:hover { background:var(--acento-oscuro); border-color:var(--acento-oscuro); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.linea { background:transparent; color:var(--texto); border-color:#444; }
  .btn.linea:hover { border-color:var(--texto); }
  .btn.bloque { display:flex; width:100%; margin-top:16px; }
  .btn.chico { padding:7px 12px; }
  label { display:block; font-size:var(--t-s); color:var(--gris); margin:14px 0 6px; }
  input, select { width:100%; padding:11px 13px; background:var(--superficie); border:1px solid var(--borde); color:var(--texto); border-radius:0; font:inherit; font-size:16px; transition:border-color .2s; }
  input:focus, select:focus { outline:none; border-color:var(--acento); }
  input.malo { border-color:var(--mal); }
  input[type=checkbox] { width:auto; accent-color:var(--acento); }
  .error { color:var(--mal); min-height:20px; margin-top:12px; font-size:var(--t-s); }
  .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; display:inline-block; animation:giro .8s linear infinite; }
  @keyframes giro { to { transform:rotate(360deg); } }

  /* Acceso */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .caja-login { width:100%; max-width:380px; }
  .caja-login .logo { justify-content:center; margin-bottom:36px; }
  .caja-login h1 { font-size:var(--t-m); text-align:center; margin-bottom:6px; }
  .caja-login .sub { text-align:center; color:var(--gris); margin-bottom:28px; }
  .pista { color:var(--gris); text-align:center; margin-top:16px; }

  /* Estructura */
  #lateral { position:fixed; top:0; bottom:0; left:0; width:var(--lateral); background:var(--superficie); border-right:1px solid var(--borde); display:flex; flex-direction:column; z-index:70; padding:22px 0; transition:transform .3s ease; }
  #lateral .logo { padding:0 20px 26px; }
  .nav button { display:flex; align-items:center; gap:14px; width:100%; padding:13px 20px; background:none; border:0; border-left:3px solid transparent; color:var(--gris); font:inherit; font-size:var(--t-s); cursor:pointer; text-align:left; transition:color .2s, background .2s; }
  .nav button:hover { color:var(--texto); }
  .nav button.activo { color:var(--texto); border-left-color:var(--acento); background:var(--superficie2); }
  .lateral-pie { margin-top:auto; padding:20px; border-top:1px solid var(--borde); }
  .empleado b { display:block; }
  .empleado span { color:var(--gris); }
  .salir { background:none; border:0; color:var(--acento); font:inherit; font-weight:600; cursor:pointer; padding:14px 0 0; display:block; }
  .salir:hover { color:#B8004A; }
  .enlace { background:none; border:0; color:var(--gris); font:inherit; font-size:12px; cursor:pointer; padding:10px 0 0; text-decoration:underline; text-align:left; }
  #fondoLateral { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:65; }
  .contenido { margin-left:var(--lateral); min-width:0; }
  header.top { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 32px; background:var(--negro); border-bottom:1px solid var(--borde); }
  header.top .izq, header.top .der { display:flex; align-items:center; gap:14px; }
  header.top h1 { font-size:var(--t-m); margin:0; }
  #btnLateral { display:none; background:none; border:0; color:var(--texto); cursor:pointer; padding:4px; }
  .pill { display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border:1px solid currentColor; font-weight:600; }
  .pill.abierta { color:var(--ok); } .pill.cerrada { color:var(--gris); }
  .pill::before { content:''; width:8px; height:8px; background:currentColor; border-radius:50%; }
  main { padding:32px; }
  section.vista { display:none; }
  section.vista.activa { display:block; animation:entrar .4s ease both; }
  @keyframes entrar { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  #progreso { position:fixed; top:0; left:0; height:2px; width:0; background:var(--acento); z-index:300; opacity:0; }

  /* Componentes */
  .caja { background:var(--superficie); border:1px solid var(--borde); padding:24px; }
  .caja + .caja, .caja + div, div + .caja { margin-top:16px; }
  .dos-col { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px; align-items:start; }
  .dos-col > div > .caja:first-child { margin-top:0; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:16px; }
  .kpi { background:var(--superficie); border:1px solid var(--borde); padding:20px; }
  .kpi small { color:var(--gris); display:block; }
  .kpi .grande { margin:8px 0 4px; font-size:32px; }
  .acciones-rapidas { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .tabla { width:100%; border-collapse:collapse; }
  .tabla th, .tabla td { text-align:left; padding:12px 8px 12px 0; border-bottom:1px solid var(--borde); vertical-align:middle; }
  .tabla th { color:var(--gris); font-weight:400; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  .tabla td.num, .tabla th.num { text-align:right; white-space:nowrap; }
  .tabla tbody tr.click { cursor:pointer; transition:background .15s; }
  .tabla tbody tr.click:hover { background:var(--superficie2); }
  .scroll-x { overflow-x:auto; }
  .estado { display:inline-block; padding:2px 8px; font-size:12px; font-weight:600; border:1px solid currentColor; white-space:nowrap; }
  .estado.activa { color:var(--ok); } .estado.por { color:var(--aviso); } .estado.vencida { color:var(--mal); }
  .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .toolbar input[type=text], .toolbar input[type=search] { max-width:340px; }
  .toolbar .espacio { margin-left:auto; }
  .filtros { display:flex; gap:8px; flex-wrap:wrap; }
  .filtros button { background:none; border:1px solid var(--borde); color:var(--gris); padding:8px 14px; font:inherit; cursor:pointer; transition:all .2s; }
  .filtros button.activo, .filtros button:hover { color:#fff; border-color:var(--acento); background:var(--acento); }
  .barra { height:6px; background:var(--borde); margin:12px 0 6px; }
  .barra span { display:block; height:100%; background:var(--acento); transition:width .8s ease; }
  .vacio { text-align:center; color:var(--gris); padding:36px 0; }
  .fila-datos { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--borde); }
  .fila-datos span:first-child { color:var(--gris); }
  .img { position:relative; width:100%; background:var(--superficie2); border:1px solid var(--borde); overflow:hidden; }
  .img img { width:100%; height:100%; object-fit:cover; }
  .img.r-43 { aspect-ratio:4/3; }
  .img.mini { width:44px; height:44px; flex-shrink:0; }

  /* Lectura de acceso */
  .scan { position:relative; height:200px; border:1px solid var(--borde); background:var(--superficie2); display:flex; align-items:center; justify-content:center; overflow:hidden; text-align:center; }
  .scan-vacio { color:var(--gris); }
  .scan.leyendo::after { content:''; position:absolute; left:0; right:0; top:0; height:2px; background:var(--acento); box-shadow:0 0 18px var(--acento); animation:barrido 1s ease-in-out infinite alternate; }
  @keyframes barrido { from { top:0; } to { top:calc(100% - 2px); } }
  .scan .estado-grande { font-size:var(--t-l); font-weight:600; line-height:1.1; animation:aparecer .35s ease both; }
  .scan.ok { border-color:var(--ok); } .scan.ok .estado-grande { color:var(--ok); }
  .scan.mal { border-color:var(--mal); } .scan.mal .estado-grande { color:var(--mal); }
  @keyframes aparecer { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:none; } }
  .fila-input { display:flex; gap:8px; }
  .fila-input input { flex:1; }
  .persona-fila { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--borde); }
  .persona-fila small { color:var(--gris); display:block; }

  /* Punto de venta */
  .pos { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; align-items:start; }
  .pos-der { position:sticky; top:84px; margin-top:0 !important; }
  .grid-cat { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-top:16px; }
  .item-cat { background:var(--superficie); border:1px solid var(--borde); padding:14px; display:flex; flex-direction:column; gap:6px; transition:border-color .2s; }
  .item-cat:hover { border-color:#444; }
  .item-cat .nombre { font-weight:600; }
  .item-cat .precio { font-size:var(--t-m); font-weight:600; }
  .item-cat .btn { margin-top:auto; }
  .plan-fila { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; background:var(--superficie); border:1px solid var(--borde); margin-top:8px; flex-wrap:wrap; }
  .plan-fila .info { flex:1; min-width:180px; }
  .linea-carrito { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--borde); }
  .linea-carrito small { color:var(--gris); display:block; }
  .cant { display:inline-flex; align-items:center; gap:8px; }
  .cant button { background:none; border:1px solid var(--borde); color:var(--texto); width:28px; height:28px; cursor:pointer; font:inherit; }
  .cant button:hover { border-color:var(--acento); color:var(--acento); }
  .quitar { background:none; border:0; color:var(--gris); cursor:pointer; font:inherit; text-decoration:underline; }
  .quitar:hover { color:var(--acento); }
  .totales .fila-datos { border-bottom:0; padding:5px 0; }
  .total-bloque { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; padding-top:14px; border-top:2px solid var(--acento); font-size:var(--t-m); font-weight:600; }
  .total-bloque span:last-child { font-size:32px; line-height:1; color:var(--acento); }
  .resultados-socio { border:1px solid var(--borde); background:var(--superficie2); max-height:240px; overflow:auto; }
  .resultados-socio button { display:flex; justify-content:space-between; gap:10px; width:100%; padding:10px 12px; background:none; border:0; border-bottom:1px solid var(--borde); color:var(--texto); font:inherit; cursor:pointer; text-align:left; }
  .resultados-socio button:hover { background:var(--superficie); }
  .cliente-card { border:1px solid var(--borde); padding:12px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start; background:var(--superficie2); }
  .aviso-caja { border-left:3px solid var(--acento); background:var(--superficie); padding:12px 16px; display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }

  /* Cobro */
  .metodos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
  .metodos button { padding:12px 6px; background:none; border:1px solid var(--borde); color:var(--gris); font:inherit; font-weight:600; cursor:pointer; transition:all .2s; }
  .metodos button.activo { border-color:var(--acento); color:#fff; background:var(--acento); }
  .rapidos { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .cambio { display:flex; justify-content:space-between; align-items:baseline; margin-top:16px; padding:14px; background:var(--superficie2); border:1px solid var(--borde); font-size:var(--t-m); font-weight:600; }
  .cambio.ok span:last-child { color:var(--ok); } .cambio.mal span:last-child { color:var(--mal); }
  .grid-form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-form .ancho { grid-column:1 / -1; }

  /* Panel lateral derecho, modal y carga */
  #fondoDrawer { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:110; opacity:0; pointer-events:none; transition:opacity .3s; }
  #fondoDrawer.abierto { opacity:1; pointer-events:auto; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px,100%); background:var(--superficie); border-left:1px solid var(--borde); transform:translateX(100%); transition:transform .35s ease; z-index:120; overflow:auto; padding:28px; }
  #drawer.abierto { transform:none; }
  .drawer-cab { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px; }
  .cerrar { background:none; border:0; color:var(--gris); font:inherit; font-size:var(--t-m); cursor:pointer; line-height:1; }
  .cerrar:hover { color:var(--texto); }
  .seccion-drawer { margin-top:28px; }
  #modal { position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.72); }
  #modal.abierto { display:flex; animation:fade .2s ease; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .modal-caja { background:var(--superficie); border:1px solid var(--borde); width:100%; max-width:520px; max-height:92vh; overflow:auto; padding:28px; }
  .modal-caja.ancho { max-width:680px; }
  .modal-pie { display:flex; gap:12px; justify-content:flex-end; flex-wrap:wrap; margin-top:24px; }
  .modal-pie .btn { margin-top:0; }
  #cargando { position:fixed; inset:0; z-index:200; background:rgba(11,11,11,.97); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #cargando.visible { opacity:1; pointer-events:auto; }
  .cargando-caja { text-align:center; width:320px; padding:24px; }
  .spinner-grande { width:56px; height:56px; border:3px solid var(--borde); border-top-color:var(--acento); border-radius:50%; margin:0 auto 24px; animation:giro .9s linear infinite; }
  #pasosCarga { list-style:none; padding:0; margin:20px 0 0; text-align:left; color:var(--gris); }
  #pasosCarga li { padding:8px 0; border-bottom:1px solid var(--borde); transition:color .3s; }
  #pasosCarga li.hecho { color:var(--texto); }
  #pasosCarga li.hecho::before { content:'✓  '; color:var(--acento); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,140px); background:var(--texto); color:var(--negro); padding:12px 18px; font-weight:600; transition:transform .35s ease; z-index:250; max-width:90vw; }
  .toast.visible { transform:translate(-50%,0); }

  /* Ticket */
  .ticket { background:#fff; color:#111; padding:24px; font-size:13px; line-height:1.5; }
  .ticket .centro { text-align:center; margin-bottom:12px; }
  .ticket b { font-weight:600; }
  .ticket table { width:100%; border-collapse:collapse; margin:10px 0; }
  .ticket td { padding:3px 0; vertical-align:top; }
  .ticket td:last-child { text-align:right; white-space:nowrap; }
  .ticket .sep { border-top:1px dashed #888; margin:8px 0; }
  .ticket .fila { display:flex; justify-content:space-between; gap:12px; }
  .ticket .total { font-size:16px; font-weight:600; }

  @media (max-width:1100px) {
    .dos-col, .pos { grid-template-columns:1fr; }
    .pos-der { position:static; }
  }
  @media (max-width:900px) {
    :root { --t-l:32px; }
    #lateral { transform:translateX(-100%); }
    #lateral.abierto { transform:none; }
    #fondoLateral.abierto { display:block; }
    .contenido { margin-left:0; }
    #btnLateral { display:block; }
    header.top { padding:12px 16px; }
    main { padding:20px 16px; }
    .grid-form { grid-template-columns:1fr; }
  }
  @media print {
    body > *:not(#modal) { display:none !important; }
    #modal { position:static; display:block !important; background:#fff; padding:0; }
    .modal-caja { border:0; max-height:none; overflow:visible; padding:0; background:#fff; }
    .no-print { display:none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></symbol>
  <symbol id="i-acceso" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/></symbol>
  <symbol id="i-socios" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.6-.2 4.6 1.2 5.2 4.3"/></symbol>
  <symbol id="i-venta" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 11.5a1 1 0 0 0 1 .8h9.8a1 1 0 0 0 1-.8L21 7H6"/></symbol>
  <symbol id="i-inventario" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="i-caja" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9v.01M18 15v.01"/></symbol>
  <symbol id="i-ventas" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-marca" viewBox="0 0 120 120"><polygon points="60,6 108,33 108,87 60,114 12,87 12,33" fill="none" stroke="#9E0032" stroke-width="5"/><rect x="24" y="52" width="72" height="16" fill="#EDEDED"/><rect x="14" y="38" width="14" height="44" fill="#EDEDED"/><rect x="92" y="38" width="14" height="44" fill="#EDEDED"/></symbol>
</svg>

<div id="progreso"></div>

<!-- Acceso de empleados -->
<div id="login">
  <div class="caja-login">
    <div class="logo"><svg class="marca" viewBox="0 0 120 120" aria-hidden="true"><use href="#i-marca"/></svg><span>PAMCAST GYM</span></div>
    <h1>Acceso de empleados</h1>
    <p class="sub">Recepción, ventas y caja.</p>
    <label for="eCorreo">Correo</label>
    <input id="eCorreo" type="email" autocomplete="username">
    <label for="eClave">Contraseña</label>
    <input id="eClave" type="password" autocomplete="current-password">
    <button class="btn bloque" id="btnEntrar" onclick="entrarEmpleado()">Entrar</button>
    <div class="error" id="errorLogin" style="text-align:center"></div>
    <p class="pista">Demo: recepcion@pamcast.mx · pamcast</p>
  </div>
</div>

<!-- Aplicación -->
<div id="app" class="oculto">
  <div id="fondoLateral" onclick="cerrarLateral()"></div>
  <aside id="lateral">

/* ================== Reglas ================== */
function sinPlan(s) { return !s.plan || s.plan === 'Sin membresía'; }
function infoEstado(s) {
  if (sinPlan(s)) return { txt:'Sin membresía', clase:'vencida', dias:null };
  const d = diasEntre(hoyISO(), s.vence);
  if (d < 0) return { txt:'Vencida', clase:'vencida', dias:d };
  if (d <= 5) return { txt:'Por vencer', clase:'por', dias:d };
  return { txt:'Activa', clase:'activa', dias:d };
}
const badge = s => { const e = infoEstado(s); return `<span class="estado ${e.clase}">${e.txt}</span>`; };
function accesoPermitido(s) {
  const hoy = hoyISO();
  if (!sinPlan(s) && s.vence >= hoy) return { ok:true, via:'membresía' };
  if ((s.pases || []).includes(hoy)) return { ok:true, via:'pase' };
  return { ok:false, motivo: sinPlan(s) ? 'El socio no tiene una membresía activa.' : `La membresía venció el ${fmtFecha(s.vence)}.` };
}
function buscarSocio(q) {
  q = (q || '').trim().toUpperCase().replace(/[\s-]/g, '');
  if (!q) return null;
  if (/^\d{1,4}$/.test(q)) return DB.socios.find(s => s.numero === q.padStart(4, '0')) || null;
  return DB.socios.find(s => s.tarjeta.replace('-', '').toUpperCase() === q || s.ident.replace(/\s/g, '') === q) || null;
}

  const ventasTarjeta = suma(m.filter(x => x.tipo === 'venta' && x.metodo === 'tarjeta'), x => x.monto);
  const ventasTransferencia = suma(m.filter(x => x.tipo === 'venta' && x.metodo === 'transferencia'), x => x.monto);
  const ingresos = suma(m.filter(x => x.tipo === 'ingreso'), x => x.monto);
  const retiros = suma(m.filter(x => x.tipo === 'retiro'), x => x.monto);

function luhn(num) {
  let s = 0, d = false;
  for (let i = num.length - 1; i >= 0; i--) { let n = +num[i]; if (d) { n *= 2; if (n > 9) n -= 9; } s += n; d = !d; }
  return s % 10 === 0;
}

    const tick = () => {
      if (i > 0) lis[i - 1].classList.add('hecho');
      if (i < lis.length) { i++; setTimeout(tick, ms); }
      else setTimeout(() => { ov.classList.remove('visible'); res(); }, 350);

    tick();
  });

function procesarAcceso(s) {
  const abierto = DB.accesos.find(a => a.numero === s.numero && !a.salida);
  if (abierto) {
    abierto.salida = new Date().toISOString(); guardar();
    return { tipo:'salida', estado:'ok', titulo:'SALIDA', s, nota:'Tiempo en el gimnasio: ' + duracion(abierto.entrada, abierto.salida) };
  }
  const p = accesoPermitido(s);
  if (!p.ok) return { tipo:'denegado', estado:'mal', titulo:'ACCESO DENEGADO', s, nota:p.motivo, renovar:true };
  DB.accesos.push({ id:++DB.seq.acceso, numero:s.numero, nombre:s.nombre, entrada:new Date().toISOString(), salida:null }); guardar();
  let nota = p.via === 'pase' ? 'Pase de visita válido para hoy.' : '';
  if (dentroAhora().length >= CAPACIDAD) nota = (nota ? nota + ' ' : '') + 'Aforo completo.';
  return { tipo:'entrada', estado:'ok', titulo:'ENTRADA', s, nota };

/* ================== Cobro ================== */
let cobroMetodo = 'efectivo';
function iniciarCobro() {
  if (!cart.length) return;
  if (!DB.caja.abierta) { toast('Abre la caja para cobrar'); ir('caja'); return; }
  if (cart.some(i => i.tipo !== 'producto') && !posSocio) { toast('Selecciona al socio para vender una membresía'); return; }
  for (const i of cart.filter(x => x.tipo === 'producto')) {
    const p = DB.productos.find(x => x.id === i.id);
    if (i.cantidad > p.stock) { toast('Stock insuficiente: ' + i.nombre); return; }
  }
  const t = calcularTotales();
  cobroMetodo = t.total === 0 ? 'puntos' : 'efectivo';
  abrirModal(`
    <span class="label">Cobro</span>
    <div class="total-bloque" style="border-top:0;margin-top:0;padding-top:0"><span>Total a cobrar</span><span>${money(t.total)}</span></div>
    ${t.total === 0 ? '<p style="margin-top:16px">La compra queda cubierta con puntos.</p><div class="error" id="errorCobro"></div>'
      : `<div class="metodos">${['efectivo', 'tarjeta', 'transferencia'].map(m => `<button data-m="${m}" class="${cobroMetodo === m ? 'activo' : ''}" onclick="setMetodo('${m}')">${etiquetaMetodo[m]}</button>`).join('')}</div>
         <div id="cobroCuerpo"></div><div class="error" id="errorCobro"></div>`}
    <div class="modal-pie"><button class="btn linea" onclick="cerrarModal()">Cancelar</button><button class="btn" id="btnConfirmar" onclick="confirmarCobro()">Confirmar cobro</button></div>`);

function setMetodo(m) { cobroMetodo = m; $$('.metodos button').forEach(b => b.classList.toggle('activo', b.dataset.m === m)); $('#errorCobro').textContent = ''; pintarMetodo(); }

    c.innerHTML = `<div class="grid-form"><div class="ancho"><label for="trBanco">Banco emisor</label><select id="trBanco"><option>BBVA</option><option>Banorte</option><option>Santander</option><option>Banamex</option><option>HSBC</option><option>Otro</option></select></div>

function fijarRecibido(v) { $('#recibido').value = v; actualizarCambio(); }
function actualizarCambio() {

async function confirmarCobro() {
  if (cobrando) return;
  const t = calcularTotales(), err = m => { $('#errorCobro').textContent = m; };
  let pago;
  if (t.total === 0) pago = { metodo:'puntos' };
  else if (cobroMetodo === 'efectivo') {
    const r = parseFloat($('#recibido').value);
    if (isNaN(r) || r < t.total) { err('El efectivo recibido es menor al total.'); return; }
    pago = { metodo:'efectivo', recibido:r, cambio:+(r - t.total).toFixed(2) };
  } else if (cobroMetodo === 'tarjeta') {
    const num = $('#tNumero').value.replace(/\s/g, ''), v = $('#tVence').value.trim(), cvc = $('#tCvc').value.trim(), m = v.match(/^(\d{2})\/(\d{2})$/), ahora = new Date();
    if (!/^\d{16}$/.test(num) || !luhn(num)) { err('Número de tarjeta no válido.'); return; }
    if (!m || +m[1] < 1 || +m[1] > 12 || new Date(2000 + +m[2], +m[1] - 1, 1) < new Date(ahora.getFullYear(), ahora.getMonth(), 1)) { err('Vencimiento no válido (MM/AA).'); return; }
    if (!/^\d{3,4}$/.test(cvc)) { err('CVC no válido.'); return; }
    err(''); cobrando = true; cerrarModalSoloVisual();
    await proceso('Procesando pago con tarjeta', ['Leyendo tarjeta', 'Contactando al banco', 'Autorizando pago'], 800);
    cobrando = false;
    if (num === '4000000000000002') { reabrirCobro(); err('Tarjeta rechazada por el banco. Prueba con otra tarjeta o forma de pago.'); return; }
    pago = { metodo:'tarjeta', tipo:$('#tTipo') ? $('#tTipo').value : 'Débito', ultimos4:num.slice(-4), autorizacion:aleatorio6() };
  } else {
    const ref = $('#trRef').value.trim();
    if (!/^[A-Za-z0-9]{6,}$/.test(ref)) { err('La referencia debe tener al menos 6 letras o números.'); return; }
    const banco = $('#trBanco').value;
    err(''); cobrando = true; cerrarModalSoloVisual();
    await proceso('Verificando transferencia', ['Consultando al banco', 'Confirmando recepción'], 900);

function finalizarVenta(pago) {
  const t = calcularTotales();
  const s = posSocio ? getSocio(posSocio) : null;
  const hoy = hoyISO();
  cart.forEach(i => {
    if (i.tipo === 'producto') DB.productos.find(p => p.id === i.id).stock -= i.cantidad;
    else if (i.tipo === 'plan') { const base = s.vence >= hoy && !sinPlan(s) ? s.vence : hoy; s.vence = sumarDias(base, i.dias); s.plan = i.nombre; }
    else if (i.tipo === 'visita') { s.pases = s.pases || []; if (!s.pases.includes(i.fecha)) s.pases.push(i.fecha); }
  });
  if (s) { s.puntos = s.puntos - t.puntosUsados + t.ganados; }
  const folio = 'T-' + String(++DB.seq.ticket).padStart(6, '0');
  DB.tickets.push({ folio, fecha:new Date().toISOString(), empleado:SESION.nombre, socio:s ? s.numero : null, cliente:s ? s.nombre : 'Público general', items:cart.map(i => ({ tipo:i.tipo, id:i.id, nombre:i.nombre, precio:i.precio, cantidad:i.cantidad })), subtotal:t.subtotal, descuento:t.descuento, puntosUsados:t.puntosUsados, total:t.total, puntosGanados:t.ganados, metodo:pago.metodo, pago });

  guardar(); actualizarEncabezado();

}

      <div class="kpi"><small>Ventas con tarjeta</small><div class="grande">${money(r.ventasTarjeta)}</div></div>
      <div class="kpi"><small>Transferencias</small><div class="grande">${money(r.ventasTransferencia)}</div></div>
      <div class="kpi"><small>Ingresos / retiros</small><div class="grande">${money(r.ingresos)} / ${money(r.retiros)}</div></div>
    </div>
    <div class="caja scroll-x"><span class="label">Movimientos del turno</span>${c.movs.length ? `<table class="tabla"><thead><tr><th>Hora</th><th>Tipo</th><th>Método</th><th>Concepto</th><th class="num">Monto</th></tr></thead><tbody>
      ${[...c.movs].reverse().map(m => `<tr ${m.folio ? `class="click" onclick="verTicket('${m.folio}')"` : ''}><td>${fmtHora(m.fecha)}</td><td>${{ venta:'Venta', ingreso:'Ingreso', retiro:'Retiro' }[m.tipo]}</td><td>${etiquetaMetodo[m.metodo]}</td><td>${esc(m.concepto)}</td><td class="num" style="color:${m.tipo === 'retiro' ? 'var(--mal)' : 'var(--texto)'}">${m.tipo === 'retiro' ? '−' : ''}${money(m.monto)}</td></tr>`).join('')}</tbody></table>` : '<div class="vacio">Aún no hay movimientos.</div>'}</div>
    <div style="margin-top:16px">${tablaCortes()}</div>`;
}
async function abrirCaja() {
  const f = parseFloat($('#fondoInicial').value);
  if (isNaN(f) || f < 0) { $('#errorCaja').textContent = 'Escribe un fondo inicial válido.'; return; }
  await proceso('Abriendo caja', ['Validando turno', 'Registrando fondo inicial'], 650);
  DB.caja = { abierta:true, fondo:f, apertura:new Date().toISOString(), empleado:SESION.nombre, movs:[] };
  guardar(); actualizarEncabezado(); toast('Caja abierta'); renderCaja();
}
function abrirMovimiento(tipo) {
  const ing = tipo === 'ingreso';
  abrirModal(`<h3>${ing ? 'Ingreso de efectivo' : 'Retiro de efectivo'}</h3><p>${ing ? 'Registra efectivo que entra a la caja fuera de una venta.' : 'Registra efectivo que sale de la caja. Efectivo disponible: ' + money(resumenCaja().esperado) + '.'}</p>
    <label for="movMonto">Monto</label><input id="movMonto" type="number" min="0" step="0.01" inputmode="decimal">
    <label for="movConcepto">Concepto</label><input id="movConcepto" placeholder="${ing ? 'Ej. Cambio de banco' : 'Ej. Pago a proveedor'}" autocomplete="off"><div class="error" id="errorMov"></div>
    <div class="modal-pie"><button class="btn linea" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="confirmarMovimiento('${tipo}')">Registrar</button></div>`);
  setTimeout(() => $('#movMonto').focus(), 50);
}
async function confirmarMovimiento(tipo) {
  const m = parseFloat($('#movMonto').value), c = $('#movConcepto').value.trim();
  const err = x => { $('#errorMov').textContent = x; };
  if (isNaN(m) || m <= 0) return err('Escribe un monto mayor a cero.');
  if (c.length < 3) return err('Escribe el concepto.');
  if (tipo === 'retiro' && m > resumenCaja().esperado) return err('El retiro excede el efectivo disponible en caja.');
  cerrarModal();
  await proceso(tipo === 'ingreso' ? 'Registrando ingreso' : 'Registrando retiro', ['Actualizando caja'], 600);
  DB.caja.movs.push({ id:++DB.seq.mov, fecha:new Date().toISOString(), tipo, metodo:'efectivo', monto:m, concepto:c });
  guardar(); toast(tipo === 'ingreso' ? 'Ingreso registrado' : 'Retiro registrado'); renderCaja();
}
function abrirCorte() {
  const r = resumenCaja();
  abrirModal(`<h3>Corte de caja</h3>
    <div class="fila-datos"><span>Fondo inicial</span><span>${money(DB.caja.fondo)}</span></div>
    <div class="fila-datos"><span>Ventas en efectivo</span><span>${money(r.ventasEfectivo)}</span></div>
    <div class="fila-datos"><span>Ingresos</span><span>${money(r.ingresos)}</span></div>
    <div class="fila-datos"><span>Retiros</span><span>−${money(r.retiros)}</span></div>
    <div class="total-bloque"><span>Efectivo esperado</span><span>${money(r.esperado)}</span></div>
    <label for="contado">Efectivo contado en caja</label><input id="contado" type="number" min="0" step="0.01" inputmode="decimal" oninput="actualizarDiferencia()">
    <div class="cambio" id="difCaja"><span>Diferencia</span><span>-</span></div><div class="error" id="errorCorte"></div>
    <div class="modal-pie"><button class="btn linea" onclick="cerrarModal()">Cancelar</button><button class="btn" onclick="confirmarCorte()">Cerrar caja</button></div>`);
  setTimeout(() => $('#contado').focus(), 50);
}
function actualizarDiferencia() {
  const c = parseFloat($('#contado').value), e = resumenCaja().esperado, b = $('#difCaja');
  if (isNaN(c)) { b.className = 'cambio'; b.innerHTML = '<span>Diferencia</span><span>-</span>'; return; }
  const d = +(c - e).toFixed(2);
  b.className = 'cambio ' + (d === 0 ? 'ok' : 'mal');
  b.innerHTML = `<span>${d === 0 ? 'Caja cuadrada' : d > 0 ? 'Sobrante' : 'Faltante'}</span><span>${d === 0 ? money(0) : money(Math.abs(d))}</span>`;
}
async function confirmarCorte() {
  const contado = parseFloat($('#contado').value);
  if (isNaN(contado) || contado < 0) { $('#errorCorte').textContent = 'Escribe el efectivo contado.'; return; }
  cerrarModal();
  await proceso('Generando corte de caja', ['Sumando movimientos', 'Comparando efectivo', 'Cerrando turno'], 800);
  const r = resumenCaja();
  const corte = { id:++DB.seq.corte, apertura:DB.caja.apertura, cierre:new Date().toISOString(), empleado:DB.caja.empleado, fondo:DB.caja.fondo, ventasEfectivo:r.ventasEfectivo, ventasTarjeta:r.ventasTarjeta, ventasTransferencia:r.ventasTransferencia, ingresos:r.ingresos, retiros:r.retiros, esperado:r.esperado, contado, diferencia:+(contado - r.esperado).toFixed(2) };
  DB.cortes.unshift(corte);
  DB.caja = { abierta:false, fondo:0, apertura:null, empleado:null, movs:[] };
  guardar(); actualizarEncabezado(); renderCaja(); verCorte(corte.id);
}
function verCorte(id) {
  const c = DB.cortes.find(x => x.id === id); if (!c) return;
  abrirModal(`<div class="ticket">
    <div class="centro"><b>PAMCAST GYM</b><br>Corte de caja</div><div class="sep"></div>
    <div class="fila"><span>Empleado</span><span>${esc(c.empleado)}</span></div>
    <div class="fila"><span>Apertura</span><span>${fmtFechaHora(c.apertura)}</span></div>
    <div class="fila"><span>Cierre</span><span>${fmtFechaHora(c.cierre)}</span></div><div class="sep"></div>
    <div class="fila"><span>Fondo inicial</span><span>${money(c.fondo)}</span></div>
    <div class="fila"><span>Ventas en efectivo</span><span>${money(c.ventasEfectivo)}</span></div>
    <div class="fila"><span>Ventas con tarjeta</span><span>${money(c.ventasTarjeta)}</span></div>
    <div class="fila"><span>Transferencias</span><span>${money(c.ventasTransferencia)}</span></div>
    <div class="fila"><span>Ingresos</span><span>${money(c.ingresos)}</span></div>
    <div class="fila"><span>Retiros</span><span>−${money(c.retiros)}</span></div><div class="sep"></div>
    <div class="fila"><span>Efectivo esperado</span><span>${money(c.esperado)}</span></div>
    <div class="fila"><span>Efectivo contado</span><span>${money(c.contado)}</span></div>
    <div class="fila total"><span>${c.diferencia === 0 ? 'Caja cuadrada' : c.diferencia > 0 ? 'Sobrante' : 'Faltante'}</span><span>${money(Math.abs(c.diferencia))}</span></div>
  </div><div class="modal-pie no-print"><button class="btn linea" onclick="window.print()">Imprimir</button><button class="btn" onclick="cerrarModal()">Cerrar</button></div>`);
}

/* ================== Historial de ventas ================== */
let vFecha = null, vTodas = false, vMetodo = 'todos', vTexto = '';
function renderVentas() {
  if (!vFecha) vFecha = hoyISO();
  $('#v-ventas').innerHTML = `
    <div class="toolbar">
      <input type="date" id="vFecha" value="${vFecha}" style="max-width:180px" ${vTodas ? 'disabled' : ''} onchange="vFecha=this.value;pintarVentas()">
      <label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--texto);cursor:pointer"><input type="checkbox" ${vTodas ? 'checked' : ''} onchange="vTodas=this.checked;renderVentas()"> Todas las fechas</label>
      <select style="max-width:180px" onchange="vMetodo=this.value;pintarVentas()">${['todos', 'efectivo', 'tarjeta', 'transferencia', 'puntos'].map(m => `<option value="${m}" ${vMetodo === m ? 'selected' : ''}>${m === 'todos' ? 'Todos los métodos' : etiquetaMetodo[m]}</option>`).join('')}</select>
      <input type="search" placeholder="Folio o cliente" value="${esc(vTexto)}" oninput="vTexto=this.value;pintarVentas()">
    </div>
    <div class="caja scroll-x" id="tablaVentas"></div>`;
  pintarVentas();
}
function pintarVentas() {
  const q = vTexto.trim().toLowerCase();
  const l = DB.tickets.filter(t => (vTodas || isoDate(new Date(t.fecha)) === vFecha) && (vMetodo === 'todos' || t.metodo === vMetodo) && (!q || t.folio.toLowerCase().includes(q) || t.cliente.toLowerCase().includes(q))).sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
  const porM = m => suma(l.filter(t => t.metodo === m), t => t.total);
  $('#tablaVentas').innerHTML = l.length ? `<table class="tabla"><thead><tr><th>Folio</th><th>Fecha</th><th>Cliente</th><th>Conceptos</th><th>Pago</th><th class="num">Total</th></tr></thead><tbody>
    ${l.map(t => `<tr class="click" onclick="verTicket('${t.folio}')"><td>${t.folio}</td><td>${fmtFechaHora(t.fecha)}</td><td>${esc(t.cliente)}</td><td>${esc(t.items.map(i => i.nombre + (i.cantidad > 1 ? ' ×' + i.cantidad : '')).join(', '))}</td><td>${etiquetaMetodo[t.metodo]}</td><td class="num">${money(t.total)}</td></tr>`).join('')}</tbody></table>
    <div style="display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap;margin-top:16px" class="gris"><span>${l.length} venta(s)</span><span>Efectivo ${money(porM('efectivo'))}</span><span>Tarjeta ${money(porM('tarjeta'))}</span><span>Transferencia ${money(porM('transferencia'))}</span><b style="color:var(--texto)">Total ${money(suma(l, t => t.total))}</b></div>` : '<div class="vacio">No hay ventas con esos criterios.</div>';
}

const RENDER = { panel:renderPanel, acceso:renderAcceso, socios:renderSocios, venta:renderVenta, inventario:renderInventario, caja:renderCaja, ventas:renderVentas };
</script>
</body>
</html>
